
services:
  mongo:
    image: mongo:7.0
    container_name: unque-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: unque-backend:1.0
    container_name: unque-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_TYPE: mongo
      MONGO_URL: mongodb://mongo:27017/unque
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
